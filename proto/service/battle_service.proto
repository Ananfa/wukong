syntax = "proto3";

import "corpc_option.proto";
import "battle_sync.proto";

option cc_generic_services = true;

package wukong.pb;

service BattleService {
    option (corpc.global_service_id) = 6;

    rpc requestBattleAssignment(RequestBattleAssignmentRequest) returns(RequestBattleAssignmentResponse);

    rpc removeBattlePlayer(RemoveBattlePlayerRequest) returns(corpc.Void)
    {
        option (corpc.not_care_response) = true;
    }
}
